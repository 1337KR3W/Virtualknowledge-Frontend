<ion-card class="calendar-container">
  <div class="calendar-header">
    <ion-button fill="clear" (click)="changeMonth(-1)">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>

    <h2>{{ displayMonth }} {{ displayYear }}</h2>

    <ion-button fill="clear" (click)="changeMonth(1)">
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="calendar-grid">
    @for (dayName of weekDays; track dayName) {
    <div class="weekday">{{ dayName }}</div>
    }

    @for (day of days; track $index) {
    <div class="day" [class.empty]="day === null" [class.selected-week]="isDayInSelectedWeek(day)">
      {{ day }}
    </div>
    }
  </div>
</ion-card>
