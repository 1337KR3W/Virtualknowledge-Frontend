<ion-app>
  @if (showLayout) {
  <ion-header>
    <ion-toolbar color="primary">
      @if (showBack$ | async) {
      <ion-buttons slot="start">
        <ion-back-button defaultHref="welcome"></ion-back-button>
      </ion-buttons>
      }

      <ion-title>Virtual Knowledge</ion-title>
    </ion-toolbar>
  </ion-header>
  }

  <main class="main-content">

    <ion-router-outlet></ion-router-outlet>

  </main>
  <ion-footer>
    <ion-toolbar color="light">
      <ion-title size="small">© 2024 - Virtual Knowledge</ion-title>
    </ion-toolbar>
  </ion-footer>
</ion-app>
