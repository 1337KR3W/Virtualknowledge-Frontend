<ion-header>
    <ion-toolbar color="primary">
        <ion-buttons slot="start">
            <ion-button (click)="goBack()">
                <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>Create new User</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

    <div class="register-container">
        <ion-card>
            <ion-card-content>
                <form (ngSubmit)="onRegister()">
                    <ion-item>
                        <ion-label position="stacked">First Name</ion-label>
                        <ion-input [(ngModel)]="newUser.firstName" name="firstName" type="text" required></ion-input>
                    </ion-item>

                    <ion-item>
                        <ion-label position="stacked">Last Name</ion-label>
                        <ion-input [(ngModel)]="newUser.lastName" name="lastName" type="text" required></ion-input>
                    </ion-item>

                    <ion-item>
                        <ion-label position="stacked">Email</ion-label>
                        <ion-input [(ngModel)]="newUser.email" name="email" type="email" required></ion-input>
                    </ion-item>

                    <ion-item>
                        <ion-label position="stacked">Password</ion-label>
                        <ion-input [(ngModel)]="newUser.password" name="password" type="password" required></ion-input>
                    </ion-item>

                    <ion-item>
                        <ion-label position="stacked">Role</ion-label>
                        <ion-select [ngModel]="newUser.roles[0]" (ngModelChange)="newUser.roles = [$event]" name="role">
                            <ion-select-option value="ROLE_USER">ROLE_USER</ion-select-option>
                            <ion-select-option value="ROLE_ADMIN">ROLE_ADMIN</ion-select-option>
                        </ion-select>
                    </ion-item>

                    <div class="ion-margin-top">
                        <ion-button expand="block" type="submit"
                            [disabled]="!newUser.firstName || !newUser.lastName || !newUser.email || !newUser.password">
                            CREATE USER
                        </ion-button>
                    </div>
                </form>
            </ion-card-content>
        </ion-card>
    </div>
</ion-content>
