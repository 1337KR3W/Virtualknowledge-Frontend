<app-base-list [title]="'Users Management'" (back)="goBack()">

    @for (u of users; track u.id) {
    <ion-item>
        <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>

        <ion-label>
            <h2 class="ion-text-uppercase"><b>{{ u.firstName }} {{ u.lastName }}</b></h2>
            <p>{{ u.email }}</p>
            @if (u.departmentId) {
            <ion-badge color="secondary" style="margin-top: 5px;">{{ u.departmentName }}</ion-badge>
            }
        </ion-label>

        <ion-buttons slot="end">
            <ion-button (click)="editUser(u)">
                <ion-icon name="create-outline"></ion-icon>
            </ion-button>
            <ion-button color="danger" (click)="deleteUser(u.id!)">
                <ion-icon name="trash-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-item>
    } @empty {
    <ion-item lines="none">
        <ion-label color="medium" class="ion-text-center">No users found.</ion-label>
    </ion-item>
    }

</app-base-list>
