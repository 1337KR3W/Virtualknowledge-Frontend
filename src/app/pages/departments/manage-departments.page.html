<app-base-list [title]="'Departments Management'" (back)="goBack()">

    @for (d of departments; track d.id) {
    <ion-item>
        <ion-icon name="business-outline" slot="start" color="primary"></ion-icon>

        <ion-label>
            <ion-badge color="secondary"><b>{{ d.name }}</b></ion-badge>
        </ion-label>

        <ion-buttons slot="end">
            <ion-button (click)="editDepartment(d)">
                <ion-icon name="create-outline"></ion-icon>
            </ion-button>
            <ion-button color="danger" (click)="deleteDepartment(d.id)">
                <ion-icon name="trash-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-item>
    } @empty {
    <ion-item lines="none">
        <ion-label color="medium" class="ion-text-center">No departments found.</ion-label>
    </ion-item>
    }

</app-base-list>
