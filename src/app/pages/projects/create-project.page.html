<ion-header>
    <ion-toolbar color="primary">
        <ion-buttons slot="start">
            <ion-button (click)="goBack()">
                <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>Create Project</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <ion-card>
        <ion-card-header>
            <ion-card-title>Project Details</ion-card-title>
        </ion-card-header>

        <ion-card-content>
            <ion-list lines="none">

                <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;">
                    <ion-input label="Project Name" labelPlacement="floating" type="text"
                        [(ngModel)]="projectData.name"></ion-input>
                </ion-item>

                <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;">
                    <ion-textarea label="Description" labelPlacement="floating"
                        [(ngModel)]="projectData.description"></ion-textarea>
                </ion-item>

                <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;">
                    <ion-input label="Start Date" labelPlacement="floating" type="date"
                        [(ngModel)]="projectData.startDate"></ion-input>
                </ion-item>

                <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;">
                    <ion-input label="End Date (Optional)" labelPlacement="floating" type="date"
                        [(ngModel)]="projectData.endDate"></ion-input>
                </ion-item>

                <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;">
                    <ion-select label="Department" labelPlacement="floating" [(ngModel)]="projectData.departmentId"
                        (ionChange)="onDepartmentChange()">
                        @for (dept of departments; track dept.id) {
                        <ion-select-option [value]="dept.id">{{ dept.name }}</ion-select-option>
                        }
                    </ion-select>
                </ion-item>

                <ion-item class="ion-margin-bottom" style="border: 1px solid #ccc; border-radius: 8px;"
                    [disabled]="!projectData.departmentId">
                    <ion-select label="Assign Worker" labelPlacement="floating" [(ngModel)]="projectData.userId">
                        @for (user of filteredUsers; track user.id) {
                        <ion-select-option [value]="user.id">{{ user.name }} ({{ user.email }})</ion-select-option>
                        } @empty {
                        <ion-select-option [disabled]="true">No workers in this department</ion-select-option>
                        }
                    </ion-select>
                </ion-item>

            </ion-list>

            <ion-button expand="block" color="success" (click)="onCreateProject()" class="ion-margin-top">
                <ion-icon slot="start" name="save-outline"></ion-icon>
                Save Project
            </ion-button>
        </ion-card-content>
    </ion-card>
</ion-content>
