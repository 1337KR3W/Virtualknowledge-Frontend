<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">

    <div class="login-wrapper">
      <div class="brand-header">
        <h1 class="brand-title">
          <span>Virtual </span> Knowledge
        </h1>
        <p class="brand-subtitle">Bienvenido al sistema de gestión</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()">

        @if (authError) {
        <div class="auth-error-banner">
          {{authError}}
        </div>
        }

        <ion-card class="ion-no-margin">
          <ion-card-content>
            <ion-item>
              <ion-label position="floating">Customer Code</ion-label>
              <ion-input formControlName="customerCode" type="text"></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="floating">Email</ion-label>
              <ion-input formControlName="email" type="email"></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="floating">Password</ion-label>
              <ion-input formControlName="password" type="password"></ion-input>
            </ion-item>

            <ion-button expand="block" type="submit" [disabled]="loginForm.invalid" class="ion-margin-top">
              Log in
            </ion-button>
          </ion-card-content>
        </ion-card>
      </form>
    </div>

  </div>
</ion-content>
